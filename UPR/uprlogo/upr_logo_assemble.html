var STEP=4, SPRING=0.014, DAMPING=0.80;
var REPEL_R=120, REPEL_F=14, NOISE=0.09;
var HOLD_SEC=8, SCATTER_T=3.0, TRAIL_FADE=0.07;

var bgC=document.getElementById('bg');
var bgX=bgC.getContext('2d');
var trC=document.getElementById('trail');
var trX=trC.getContext('2d');
var mc=document.getElementById('main');
var ctx=mc.getContext('2d');
var overlay=document.getElementById('logo-overlay');
var limg=document.getElementById('limg');
var W,H;

function resize(){
  W=bgC.width=trC.width=mc.width=window.innerWidth;
  H=bgC.height=trC.height=mc.height=window.innerHeight;
  drawBG();
}
function drawBG(){
  var g=bgX.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#d2e5f5');
  g.addColorStop(0.4,'#dfedf8');
  g.addColorStop(0.75,'#ecf4fb');
  g.addColorStop(1,'#f3f8fd');
  bgX.fillStyle=g;
  bgX.fillRect(0,0,W,H);
}
resize();
window.addEventListener('resize',resize);

// SHAPES
function star(c,cx,cy,r){
  c.beginPath();
  for(var i=0;i<10;i++){
    var rad=i%2===0?r:r*0.42;
    var a=i*Math.PI/5-Math.PI/2;
    i===0?c.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)
         :c.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  c.closePath();c.fill();
}
function flash(c,cx,cy,sz){
  c.beginPath();
  c.moveTo(cx+sz*0.22,cy-sz);
  c.lineTo(cx-sz*0.14,cy-sz*0.05);
  c.lineTo(cx+sz*0.18,cy-sz*0.05);
  c.lineTo(cx-sz*0.22,cy+sz);
  c.lineTo(cx+sz*0.14,cy+sz*0.05);
  c.lineTo(cx-sz*0.18,cy+sz*0.05);
  c.closePath();c.fill();
}
function sparkle(c,cx,cy,r){
  c.beginPath();
  for(var i=0;i<8;i++){
    var rad=i%2===0?r:r*0.22;
    var a=(i/8)*Math.PI*2-Math.PI/4;
    i===0?c.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad)
         :c.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  c.closePath();c.fill();
}
function diamond(c,cx,cy,r){
  c.beginPath();
  c.moveTo(cx,cy-r);c.lineTo(cx+r*0.6,cy);
  c.lineTo(cx,cy+r);c.lineTo(cx-r*0.6,cy);
  c.closePath();c.fill();
}
function person(c,cx,cy,sz){
  c.beginPath();c.arc(cx,cy-sz*0.58,sz*0.28,0,Math.PI*2);c.fill();
  c.beginPath();
  c.moveTo(cx-sz*0.27,cy-sz*0.22);
  c.quadraticCurveTo(cx-sz*0.31,cy+sz*0.55,cx-sz*0.13,cy+sz*0.58);
  c.lineTo(cx+sz*0.13,cy+sz*0.58);
  c.quadraticCurveTo(cx+sz*0.31,cy+sz*0.55,cx+sz*0.27,cy-sz*0.22);
  c.closePath();c.fill();
}
var SHAPES=['star','flash','sparkle','diamond','person','diamond'];
function drawShape(c,type,cx,cy,sz,rot){
  c.save();
  c.translate(cx,cy);c.rotate(rot);c.translate(-cx,-cy);
  if(type==='star')    star(c,cx,cy,sz*1.2);
  else if(type==='flash')   flash(c,cx,cy,sz*1.0);
  else if(type==='sparkle') sparkle(c,cx,cy,sz*1.3);
  else if(type==='diamond') diamond(c,cx,cy,sz*1.2);
  else if(type==='person')  {c.rotate(-rot);person(c,cx,cy,sz*1.4);}
  c.restore();
}

// MOUSE
var mx=-9999,my=-9999;
window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});
window.addEventListener('mouseleave',function(){mx=-9999;my=-9999;});
window.addEventListener('touchmove',function(e){mx=e.touches[0].clientX;my=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchend',function(){mx=-9999;my=-9999;});

// PARTICLES
var particles=[],logoW,logoH,ox,oy;
var state='entering',stateTimer=0;
var pOp=1,targetPOp=1;

function edgePoint(){
  var s=Math.floor(Math.random()*4),m=150;
  if(s===0)return{x:Math.random()*W,y:-m};
  if(s===1)return{x:W+m,y:Math.random()*H};
  if(s===2)return{x:Math.random()*W,y:H+m};
  return{x:-m,y:Math.random()*H};
}

function build(data,offW,offH){
  logoW=Math.min(W*0.55,520);
  logoH=logoW*(offH/offW);
  ox=(W-logoW)/2; oy=(H-logoH)/2;
  limg.style.width=logoW+'px';
  var sx=logoW/offW,sy=logoH/offH;
  particles=[];
  for(var py=0;py<offH;py+=STEP){
    for(var px=0;px<offW;px+=STEP){
      var i=(py*offW+px)*4;
      if(data[i+3]<20)continue;
      var ep=edgePoint();
      particles.push({
        htx:ox+px*sx,hty:oy+py*sy,
        tx:ox+px*sx,ty:oy+py*sy,
        x:ep.x,y:ep.y,vx:0,vy:0,
        r:data[i],g:data[i+1],b:data[i+2],a:data[i+3]/255,
        sz:3.5+Math.random()*2.5,
        noise:Math.random()*Math.PI*2,
        rot:Math.random()*Math.PI*2,
        rotV:(Math.random()-0.5)*0.03,
        delay:Math.random()*1.8,born:0,
        type:SHAPES[Math.floor(Math.random()*SHAPES.length)]
      });
    }
  }
}

function scatter(){
  if(state==='scattering')return;
  state='scattering';stateTimer=0;
  overlay.style.transition='opacity 0.6s ease';
  overlay.style.opacity='0';
  targetPOp=1;
  particles.forEach(function(p){
    var a=Math.random()*Math.PI*2;
    var rad=Math.max(W,H)*(0.55+Math.random()*1.5);
    p.tx=W/2+Math.cos(a)*rad;
    p.ty=H/2+Math.sin(a)*rad;
    p.x=p.htx;p.y=p.hty;
    var dx=p.tx-p.x,dy=p.ty-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    p.vx=(dx/d)*(4+Math.random()*5);
    p.vy=(dy/d)*(4+Math.random()*5);
    p.born=0;p.delay=Math.random()*0.25;
  });
}

function enter(){
  state='entering';stateTimer=0;
  particles.forEach(function(p){
    p.tx=p.htx;p.ty=p.hty;
    p.vx*=0.1;p.vy*=0.1;
    p.born=0;p.delay=Math.random()*1.6;
    p.rot=Math.random()*Math.PI*2;
  });
}

window.addEventListener('mousemove',function(){
  if(state!=='formed')return;
  if(mx>ox-60&&mx<ox+logoW+60&&my>oy-60&&my<oy+logoH+60) scatter();
});
window.addEventListener('touchstart',function(){if(state==='formed')scatter();},{passive:true});

// LOOP
var lastT=null;
function loop(ts){
  var dt=lastT?Math.min((ts-lastT)/1000,0.05):0.016;
  lastT=ts;stateTimer+=dt;
  pOp+=(targetPOp-pOp)*0.035;
  ctx.clearRect(0,0,W,H);

  if(pOp>0.01){
    trX.fillStyle='rgba(212,229,245,'+TRAIL_FADE+')';
    trX.fillRect(0,0,W,H);
    var allNear=true;
    particles.forEach(function(p){
      p.born+=dt;
      if(p.born<p.delay)return;
      var fx=(p.tx-p.x)*SPRING,fy=(p.ty-p.y)*SPRING;
      var mdx=p.x-mx,mdy=p.y-my,md=Math.sqrt(mdx*mdx+mdy*mdy);
      var rfx=0,rfy=0;
      if(md<REPEL_R&&md>0.5){
        var str=Math.pow(1-md/REPEL_R,1.8)*REPEL_F;
        rfx=(mdx/md)*str;rfy=(mdy/md)*str;
      }
      p.noise+=dt*0.65;
      var nfx=Math.cos(p.noise)*NOISE,nfy=Math.sin(p.noise*1.3)*NOISE;
      p.vx=(p.vx+fx+rfx+nfx)*DAMPING;
      p.vy=(p.vy+fy+rfy+nfy)*DAMPING;
      p.x+=p.vx;p.y+=p.vy;p.rot+=p.rotV;
      if(state==='entering'){
        var dx=p.htx-p.x,dy=p.hty-p.y;
        if(Math.sqrt(dx*dx+dy*dy)>10)allNear=false;
      }
      var al=p.a*pOp;
      trX.save();trX.globalAlpha=al*0.5;
      trX.fillStyle='rgb('+p.r+','+p.g+','+p.b+')';
      drawShape(trX,p.type,p.x,p.y,p.sz*0.65,p.rot);
      trX.restore();
      ctx.save();ctx.globalAlpha=al;
      ctx.fillStyle='rgb('+p.r+','+p.g+','+p.b+')';
      drawShape(ctx,p.type,p.x,p.y,p.sz,p.rot);
      ctx.restore();
    });
    if(state==='entering'&&allNear&&particles.length>0){
      state='formed';stateTimer=0;
      targetPOp=0;
      setTimeout(function(){
        overlay.style.transition='opacity 1.6s ease';
        overlay.style.opacity='1';
      },400);
    }
  } else if(state==='formed'){
    trX.clearRect(0,0,W,H);
  }

  if(state==='formed'&&stateTimer>HOLD_SEC) scatter();
  if(state==='scattering'&&stateTimer>SCATTER_T) enter();
  requestAnimationFrame(loop);
}

// INIT
var img=new Image();
img.onload=function(){
  limg.src=LOGO_SRC;
  var tmpW=Math.min(500,img.naturalWidth);
  var tmpH=tmpW*(img.naturalHeight/img.naturalWidth);
  var off=document.createElement('canvas');
  off.width=tmpW;off.height=tmpH;
  var oc=off.getContext('2d');
  oc.drawImage(img,0,0,tmpW,tmpH);
  var data=oc.getImageData(0,0,tmpW,tmpH).data;
  build(data,tmpW,tmpH);
  requestAnimationFrame(loop);
};
img.src=LOGO_SRC;
</script>
